<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>data-action Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/css/pico.min.css" rel="preload" as="style">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/images/timer.ico" rel="icon" type="image/x-icon">
  <link href="/manifest.json" rel="manifest">
</head>

<body class="container">

  <header>
    <nav>
      <ul>
        <li class="pb-0 pt-0">
          <h1 class="m-0">
            <img data-action="addTimer" class="pointer" src="/images/timer.svg" alt="Timer Hourglass logo"
              style="height: 2em; width: 1.56em;">
          </h1>
        </li>
      </ul>
      <ul>
        <li><button data-action="addTimer">Add Timer</button></li>
        <li><button data-action="openAppSettings" aria-label="Options for all timers">&#9881;</button></li>
        <li><button data-action="downloadData" aria-label="Download timer data" title="Download timer data">&#11015;</button></li>
        <li><button data-action="uploadData" aria-label="Upload timer data" title="Upload timer data">&#11014;</button></li>
      </ul>
    </nav>
  </header>

  <main id="timer">
    <section id="timers" class="grid timer-cards">
      <template id="timerTemplate">
        <article data-root>
          <header class="pb-0">
            <fieldset role="group">
              <input x="title" data-action="saveTitle" class="plain" name="title" type="text" placeholder="Title">
              <label x="titleLabel" aria-label="Timer Title">&#9998;</label>
            </fieldset>
          </header>
          <fieldset role="group">
            <input x="hours" data-action="saveTime" name="hours" type="number" placeholder="h">
            <input x="minutes" data-action="saveTime" name="minutes" type="number" placeholder="m">
            <input x="seconds" data-action="saveTime" name="seconds" type="number" placeholder="s">
          </fieldset>
          <div class="flex justify-between">
            <div class="flex">
              <button x="clock" data-action="toggleTimerState" style="width: 140px;"
                title="Click to stop." aria-label="Click to start.">Start</button>
              <span hidden><audio x="audio" loop></audio></span>
              <button x="restart" data-action="start" hidden aria-label="Restart">&#8635;</button>
              <button data-action="openSettings" aria-label="Timer options">&#9881;</button>
              <button data-action="deleteTimer" aria-label="Delete timer">❌</button>
            </div>
          </div>
          <dialog x="settings">
            <article data-box>
              <header>
                <button x="settingsClose" aria-label="Close" value="cancel" rel="prev"></button>
                <h2 class="inline">Options</h2>
              </header>
              <fieldset x="sounds">
                <legend>Sound</legend>
              </fieldset>
            </article>
            <form x="settingsForm" method="dialog"></form>
          </dialog>
        </article>
      </template>
    </section>
  </main>

  <dialog id="appSettings">
    <article data-box>
      <header>
        <button form="appSettingsForm" aria-label="Close" value="cancel" rel="prev"></button>
        <h2 class="inline">Options for All Timers</h2>
      </header>
      <h3>Allowed Sounds</h3>
      <form id="allowedSounds">
        <button type="button" id="toggleSounds" data-action="toggleSounds">Select All</button>
        <hr>
      </form>
    </article>
    <form id="appSettingsForm" method="dialog"></form>
  </dialog>

  <footer class="container">
    <a href="https://github.com/jon49/timer/tree/master/src/data-action">Source Code</a>
    <br>
    <small>Created with <a href="https://github.com/jon49/timer/blob/master/src/data-action/src/shared/data-action.ts">data-action attributes</a></small>
    <br>
    <small>Created with <a href="https://www.freesoundeffects.com/">Sounds</a>.</small>
  </footer>

  <script src="/src/main.ts" type="module"></script>
</body>

</html>
