<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scoped Morph Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/css/nimble.css" rel="preload" as="style">
  <link href="/css/main.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <link href="/images/timer.ico" rel="icon" type="image/x-icon">
  <link href="/manifest.json" rel="manifest">
  <script src="/src/main.ts" type="module"></script>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li class="pb-0 pt-0">
          <h1 class="m-0">
            <img _click="addTimer" class="pointer" src="/images/timer.svg" alt="Timer Hourglass logo"
              style="height: 2em; width: 1.56em;">
          </h1>
        </li>
      </ul>
      <ul>
        <li><button class="theme-toggle" aria-label="Toggle theme" title="Toggle theme"></button></li>
        <li><button _click="addTimer">Add Timer</button></li>
        <li><button _click="openGlobalSettings" aria-label="Options for all timers">&#9881;</button></li>
        <li><button _click="downloadData" aria-label="Download timer data" title="Download timer data">&#11015;</button></li>
        <li><button _click="uploadData" aria-label="Upload timer data" title="Upload timer data">&#11014;</button></li>
      </ul>
    </nav>
  </header>

  <main id="app">
    <section id="timers" class="grid timer-cards"></section>
    <div id="dialog"></div>
  </main>

  <footer>
    <a href="https://github.com/jon49/timer/tree/master/src/morph-scoped-timer">Source Code</a>
    <br>
    <small>Created with
      <a href="https://github.com/jon49/html-template-tag-async">html-template-tag-stream</a>,
      <a href="https://github.com/bigskysoftware/idiomorph">idiomorph</a> and
      <a href="https://github.com/jon49/jon49-web">@jon49/web</a></small>
    <br>
    <small>Created with <a href="https://www.freesoundeffects.com/">Sounds</a>.</small>
  </footer>
</body>
</html>
